<!DOCTYPE html>
<html class="dark" lang="en">
<head><title>Injection Guard · History</title><!--HEAD--></head>
<body class="bg-surface font-body-default text-on-surface antialiased">
<div id="shell"></div>
<main class="w-full pt-20 bg-surface min-h-screen px-margin pb-space-2xl lg:pl-64">
<div class="bg-surface-container-low rounded p-space-md flex flex-col gap-space-md">
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-space-sm">
    <div class="flex items-center gap-space-xs"><span class="material-symbols-outlined text-outline text-[18px]">history</span><span class="font-panel-title text-panel-title text-on-surface">Every request the guard handled</span><span class="font-mono-data text-badge-label text-outline bg-surface-container px-space-xs py-space-2xs rounded" id="count">–</span></div>
    <div class="flex flex-wrap items-center gap-space-xs">
      <div class="flex items-center gap-space-xs bg-surface-container-lowest border border-outline-variant/40 rounded px-space-sm py-space-2xs"><span class="material-symbols-outlined text-outline text-[16px]">search</span><input class="bg-transparent font-mono-data text-body-sm text-on-surface placeholder:text-outline focus:outline-none w-56" id="q" placeholder="search message, session, rule"></div>
      <div class="flex items-center rounded bg-surface-container-lowest border border-outline-variant/40 font-mono-data text-badge-label" id="filters"><button data-f="all" class="px-space-sm py-space-2xs rounded bg-primary text-surface" type="button">All</button><button data-f="allowed" class="px-space-sm py-space-2xs text-outline hover:text-on-surface" type="button">Allowed</button><button data-f="blocked" class="px-space-sm py-space-2xs text-outline hover:text-on-surface" type="button">Blocked</button></div>
      <a class="flex items-center gap-space-xs bg-surface-container hover:bg-surface-container-high text-on-surface-variant px-space-sm py-space-2xs rounded font-mono-data text-badge-label" href="/api/log.csv"><span class="material-symbols-outlined text-[14px]">download</span>Download CSV</a>
      <button class="flex items-center gap-space-xs bg-surface-container hover:bg-surface-container-high text-on-surface-variant hover:text-error px-space-sm py-space-2xs rounded font-mono-data text-badge-label" id="clear" type="button"><span class="material-symbols-outlined text-[14px]">delete_sweep</span>Clear the log</button>
    </div>
  </div>
  <div class="overflow-x-auto"><table class="w-full text-left"><thead><tr class="border-b border-outline-variant/30 text-outline font-panel-title text-panel-title"><th class="py-space-xs px-space-sm font-medium">Time</th><th class="py-space-xs px-space-sm font-medium">Surface</th><th class="py-space-xs px-space-sm font-medium">Session</th><th class="py-space-xs px-space-sm font-medium">Message</th><th class="py-space-xs px-space-sm font-medium text-right">Score</th><th class="py-space-xs px-space-sm font-medium text-center">Verdict</th><th class="py-space-xs px-space-sm font-medium text-center">Model reply</th><th class="py-space-xs px-space-sm font-medium text-right">Detector</th><th class="py-space-xs px-space-sm font-medium text-center">Actions</th></tr></thead><tbody class="divide-y divide-surface-container font-mono-data text-body-sm text-on-surface" id="rows"></tbody></table></div>
  <div class="font-mono-data text-badge-label text-outline" id="showing">–</div>
</div>
</main>
<script>
(async () => {
  await shell("history");
  let rows = [], filter = "all", query = "";
  const redraw = () => { const t = tableRowsHTML(rows, { live: true, filter, query }); document.getElementById("rows").innerHTML = t.html || `<tr><td class="py-space-md px-space-sm text-outline" colspan="9">nothing logged yet</td></tr>`; document.getElementById("showing").textContent = `showing ${t.shown} of ${rows.length}`; document.getElementById("count").textContent = `${rows.length} request(s)`; };
  const load = async () => { rows = (await API.get("/api/log")).rows; redraw(); };
  document.getElementById("q").addEventListener("input", e => { query = e.target.value; redraw(); });
  document.querySelectorAll("#filters button").forEach(b => b.addEventListener("click", () => { filter = b.dataset.f; document.querySelectorAll("#filters button").forEach(x => x.className = "px-space-sm py-space-2xs text-outline hover:text-on-surface"); b.className = "px-space-sm py-space-2xs rounded bg-primary text-surface"; redraw(); }));
  document.getElementById("clear").addEventListener("click", async () => { if (confirm("Clear the shared log file?")) { await API.post("/api/log/clear"); await load(); refreshSideCounts(); } });
  await load();
})();
</script>
</body>
</html>
